name: Validate portfolio

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - name: Check browser layouts and accessibility
        run: |
          npm run preview -- --host 127.0.0.1 --port 4323 > /tmp/bauhaus-preview.log 2>&1 &
          node --input-type=module <<'JS'
          let ready = false;
          for (let attempt = 0; attempt < 30; attempt++) {
            try { const response = await fetch('http://127.0.0.1:4323/'); if (response.ok) { ready = true; break; } } catch {}
            await new Promise(resolve => setTimeout(resolve, 1000));
          }
          if (!ready) throw new Error('Portfolio preview did not start within 30 seconds');
          JS
          npm run verify:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portfolio-browser-review
          path: |
            /tmp/bauhaus-browser-qa
            /tmp/bauhaus-preview.log
